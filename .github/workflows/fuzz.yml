name: Fuzz

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz protocol decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-fuzz
      - name: Fuzz decode_message
        # explicit target: the prebuilt cargo-fuzz is musl-static and would
        # otherwise default to its own (sanitizer-incompatible) musl triple
        run: cargo +nightly fuzz run decode_message --target x86_64-unknown-linux-gnu -- -max_total_time=180
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
