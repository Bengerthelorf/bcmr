name: Fuzz

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz protocol decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install cargo-fuzz
        run: which cargo-fuzz || cargo install cargo-fuzz
      - name: Fuzz decode_message
        run: cargo +nightly fuzz run decode_message -- -max_total_time=180
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
