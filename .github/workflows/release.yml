name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag, package version, and main ancestry
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" != refs/tags/* ]] ||
             [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release workflow requires a SemVer tag such as v0.7.0 or v0.7.0-rc.1"
            exit 1
          fi

          version=$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ { in_package=0 }
            in_package && /^version = "/ {
              gsub(/^version = "|"[[:space:]]*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          [[ -n "$version" ]] || {
            echo "::error::could not read [package].version from Cargo.toml"
            exit 1
          }
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::tag $tag does not match Cargo.toml version $version"
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::tag target $GITHUB_SHA is not contained in origin/main"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: release-gate
    uses: ./.github/workflows/test.yml

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [release-gate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: bcmr-x86_64-linux
            strip: true
            ext: ""

          - target: x86_64-apple-darwin
            os: macos-15
            name: bcmr-x86_64-macos
            strip: true
            ext: ""

          - target: aarch64-apple-darwin
            os: macos-15
            name: bcmr-aarch64-macos
            strip: true
            ext: ""

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: bcmr-aarch64-linux
            strip: false
            cross: true
            ext: ""

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: bcmr-x86_64-windows
            strip: false
            ext: ".exe"

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: bcmr-aarch64-windows
            strip: false
            ext: ".exe"

          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            name: bcmr-x86_64-freebsd
            strip: false
            cross: true
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2 --locked

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Configure build environment
        shell: bash
        run: |
          echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
          echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV

      - name: Build binary
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: ${{ matrix.cross }}
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Strip binary
        if: matrix.strip
        run: strip target/${{ matrix.target }}/release/bcmr${{ matrix.ext }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bcmr${{ matrix.ext }} dist/

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  crate-check:
    name: Validate crates.io package
    runs-on: ubuntu-latest
    needs: [release-gate, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Package dry run
        run: cargo publish --locked --dry-run

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [release-gate, build, crate-check]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Prepare release assets
        shell: bash
        run: bash scripts/prepare-release-assets.sh dist

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}" >> CHANGELOG.md
            echo "" >> CHANGELOG.md

            echo "### Changes since ${PREVIOUS_TAG}:" >> CHANGELOG.md
            echo "" >> CHANGELOG.md

            FEATS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -i "^- feat" || true)
            FIXES=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -i "^- fix" || true)
            OTHERS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -iv "^- feat\|^- fix\|^- chore\|^- docs\|^- ci" || true)
            CHORES=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -i "^- chore\|^- docs\|^- ci" || true)

            if [ -n "$FEATS" ]; then
              echo "#### Features" >> CHANGELOG.md
              echo "$FEATS" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            if [ -n "$FIXES" ]; then
              echo "#### Bug Fixes" >> CHANGELOG.md
              echo "$FIXES" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            if [ -n "$OTHERS" ]; then
              echo "#### Other" >> CHANGELOG.md
              echo "$OTHERS" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            if [ -n "$CHORES" ]; then
              echo "<details><summary>Maintenance</summary>" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
              echo "$CHORES" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
              echo "</details>" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
          else
            echo "### Initial Release" >> CHANGELOG.md
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi

          echo "" >> CHANGELOG.md
          echo "## Download" >> CHANGELOG.md
          echo "Choose the appropriate binary for your platform:" >> CHANGELOG.md
          echo "- **Linux x86_64**: bcmr-x86_64-linux.tar.gz (statically linked)" >> CHANGELOG.md
          echo "- **Linux ARM64**: bcmr-aarch64-linux.tar.gz (statically linked)" >> CHANGELOG.md
          echo "- **macOS Intel**: bcmr-x86_64-macos.tar.gz" >> CHANGELOG.md
          echo "- **macOS Apple Silicon**: bcmr-aarch64-macos.tar.gz" >> CHANGELOG.md
          echo "- **Windows x86_64**: bcmr-x86_64-windows.zip" >> CHANGELOG.md
          echo "- **Windows ARM64**: bcmr-aarch64-windows.zip" >> CHANGELOG.md
          echo "- **FreeBSD x86_64**: bcmr-x86_64-freebsd.tar.gz" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Verify downloads with \`sha256sums.txt\`." >> CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ needs.release-gate.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-install:
    name: Verify released installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [release-gate, release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install and exercise released binary
        shell: bash
        env:
          BCMR_VERSION: v${{ needs.release-gate.outputs.version }}
          EXPECTED_VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          export BCMR_INSTALL_DIR="$RUNNER_TEMP/bcmr released/bin"
          bash install.sh
          export BCMR="$BCMR_INSTALL_DIR/bcmr"
          test "$("$BCMR" --version)" = "bcmr $EXPECTED_VERSION"
          python3 tests/shell_integration_test.py
          python3 tests/remote_completion_test.py
          python3 tests/cli_help_test.py
          python3 tests/config_doctor_test.py
          python3 tests/managed_update_test.py
          python3 tests/deploy_test.py

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [release, verify-install]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  update-tap:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [release-gate, release, verify-install]
    if: needs.release-gate.outputs.prerelease == 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get Release Info
        id: release
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          TAG=${GITHUB_REF#refs/tags/}
          echo "FORMULA_VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Download verified release checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output sha256sums.txt \
            "https://github.com/Bengerthelorf/bcmr/releases/download/${{ steps.release.outputs.VERSION }}/sha256sums.txt"

      - name: Checkout Tap Repository
        uses: actions/checkout@v6
        with:
          repository: Bengerthelorf/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/render-homebrew-formula.sh \
            "${{ steps.release.outputs.VERSION }}" sha256sums.txt > bcmr.rb
          mv bcmr.rb homebrew-tap/Formula/bcmr.rb
          cd homebrew-tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/bcmr.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update bcmr to ${{ steps.release.outputs.VERSION }}"
            git push origin main
          fi

  verify-tap:
    name: Verify published Homebrew package
    runs-on: macos-15
    needs: [release-gate, update-tap]
    if: needs.release-gate.outputs.prerelease == 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install and test published formula
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          brew tap Bengerthelorf/tap
          brew install Bengerthelorf/tap/bcmr
          brew test Bengerthelorf/tap/bcmr
          export BCMR="$(brew --prefix bcmr)/bin/bcmr"
          test "$("$BCMR" --version)" = "bcmr $EXPECTED_VERSION"
          python3 tests/shell_integration_test.py
          python3 tests/remote_completion_test.py
          python3 tests/cli_help_test.py
          python3 tests/config_doctor_test.py
          python3 tests/managed_update_test.py
          python3 tests/deploy_test.py
