name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag, package version, and main ancestry
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" != refs/tags/* ]] ||
             [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release workflow requires a SemVer tag such as v0.7.0 or v0.7.0-rc.1"
            exit 1
          fi

          version=$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ { in_package=0 }
            in_package && /^version = "/ {
              gsub(/^version = "|"[[:space:]]*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          [[ -n "$version" ]] || {
            echo "::error::could not read [package].version from Cargo.toml"
            exit 1
          }
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::tag $tag does not match Cargo.toml version $version"
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::tag target $GITHUB_SHA is not contained in origin/main"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: release-gate
    uses: ./.github/workflows/test.yml

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [release-gate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: bcmr-x86_64-linux
            strip: true
            ext: ""

          - target: x86_64-apple-darwin
            os: macos-latest
            name: bcmr-x86_64-macos
            strip: true
            ext: ""

          - target: aarch64-apple-darwin
            os: macos-latest
            name: bcmr-aarch64-macos
            strip: true
            ext: ""

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: bcmr-aarch64-linux
            strip: false
            cross: true
            ext: ""

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: bcmr-x86_64-windows
            strip: false
            ext: ".exe"

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: bcmr-aarch64-windows
            strip: false
            ext: ".exe"

          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            name: bcmr-x86_64-freebsd
            strip: false
            cross: true
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2 --locked

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Configure build environment
        shell: bash
        run: |
          echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
          echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV

      - name: Build binary
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: ${{ matrix.cross }}
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Strip binary
        if: matrix.strip
        run: strip target/${{ matrix.target }}/release/bcmr${{ matrix.ext }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bcmr${{ matrix.ext }} dist/

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  crate-check:
    name: Validate crates.io package
    runs-on: ubuntu-latest
    needs: [release-gate, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Package dry run
        run: cargo publish --locked --dry-run

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [release-gate, build, crate-check]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            bcmr-x86_64-linux
            bcmr-aarch64-linux
            bcmr-x86_64-macos
            bcmr-aarch64-macos
            bcmr-x86_64-windows
            bcmr-aarch64-windows
            bcmr-x86_64-freebsd
          )

          for name in "${expected[@]}"; do
            test -d "dist/$name" || {
              echo "::error::missing build artifact $name"
              exit 1
            }
            if [[ "$name" == *-windows ]]; then
              test -f "dist/$name/bcmr.exe" || {
                echo "::error::$name does not contain bcmr.exe"
                exit 1
              }
              (cd "dist/$name" && zip -q "../${name}.zip" bcmr.exe)
            else
              test -f "dist/$name/bcmr" || {
                echo "::error::$name does not contain bcmr"
                exit 1
              }
              tar -C "dist/$name" -czf "dist/${name}.tar.gz" bcmr
            fi
          done

          cd dist
          sha256sum *.tar.gz *.zip > sha256sums.txt
          test "$(wc -l < sha256sums.txt)" -eq 7

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}" >> CHANGELOG.md
            echo "" >> CHANGELOG.md

            echo "### Changes since ${PREVIOUS_TAG}:" >> CHANGELOG.md
            echo "" >> CHANGELOG.md

            FEATS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -i "^- feat" || true)
            FIXES=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -i "^- fix" || true)
            OTHERS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -iv "^- feat\|^- fix\|^- chore\|^- docs\|^- ci" || true)
            CHORES=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -i "^- chore\|^- docs\|^- ci" || true)

            if [ -n "$FEATS" ]; then
              echo "#### Features" >> CHANGELOG.md
              echo "$FEATS" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            if [ -n "$FIXES" ]; then
              echo "#### Bug Fixes" >> CHANGELOG.md
              echo "$FIXES" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            if [ -n "$OTHERS" ]; then
              echo "#### Other" >> CHANGELOG.md
              echo "$OTHERS" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            if [ -n "$CHORES" ]; then
              echo "<details><summary>Maintenance</summary>" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
              echo "$CHORES" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
              echo "</details>" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
          else
            echo "### Initial Release" >> CHANGELOG.md
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi

          echo "" >> CHANGELOG.md
          echo "## Download" >> CHANGELOG.md
          echo "Choose the appropriate binary for your platform:" >> CHANGELOG.md
          echo "- **Linux x86_64**: bcmr-x86_64-linux.tar.gz (statically linked)" >> CHANGELOG.md
          echo "- **Linux ARM64**: bcmr-aarch64-linux.tar.gz (statically linked)" >> CHANGELOG.md
          echo "- **macOS Intel**: bcmr-x86_64-macos.tar.gz" >> CHANGELOG.md
          echo "- **macOS Apple Silicon**: bcmr-aarch64-macos.tar.gz" >> CHANGELOG.md
          echo "- **Windows x86_64**: bcmr-x86_64-windows.zip" >> CHANGELOG.md
          echo "- **Windows ARM64**: bcmr-aarch64-windows.zip" >> CHANGELOG.md
          echo "- **FreeBSD x86_64**: bcmr-x86_64-freebsd.tar.gz" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Verify downloads with \`sha256sums.txt\`." >> CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ needs.release-gate.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  update-tap:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [release-gate, release]
    if: needs.release-gate.outputs.prerelease == 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get Release Info
        id: release
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          TAG=${GITHUB_REF#refs/tags/}
          echo "FORMULA_VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Read verified release checksums
        id: shasum
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.release.outputs.VERSION }}
          base="https://github.com/Bengerthelorf/bcmr/releases/download/${VERSION}"
          curl --fail --location --retry 5 --retry-all-errors \
            --output sha256sums.txt "${base}/sha256sums.txt"

          checksum() {
            local asset=$1
            local hash
            hash=$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print $1; exit }' sha256sums.txt)
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::invalid or missing checksum for $asset"
              exit 1
            }
            printf '%s' "$hash"
          }

          echo "SHA_ARM_MAC=$(checksum bcmr-aarch64-macos.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "SHA_INTEL_MAC=$(checksum bcmr-x86_64-macos.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "SHA_X86_LINUX=$(checksum bcmr-x86_64-linux.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "SHA_ARM_LINUX=$(checksum bcmr-aarch64-linux.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Checkout Tap Repository
        uses: actions/checkout@v7
        with:
          repository: Bengerthelorf/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        run: |
          cd homebrew-tap/Formula

          cat > bcmr.rb <<EOF
          class Bcmr < Formula
            desc "Better Copy Move Remove - A modern, safe file operation tool"
            homepage "https://github.com/Bengerthelorf/bcmr"
            version "${{ steps.release.outputs.FORMULA_VERSION }}"
            license "Apache-2.0"

            if OS.mac?
              if Hardware::CPU.arm?
                url "https://github.com/Bengerthelorf/bcmr/releases/download/${{ steps.release.outputs.VERSION }}/bcmr-aarch64-macos.tar.gz"
                sha256 "${{ steps.shasum.outputs.SHA_ARM_MAC }}"
              else
                url "https://github.com/Bengerthelorf/bcmr/releases/download/${{ steps.release.outputs.VERSION }}/bcmr-x86_64-macos.tar.gz"
                sha256 "${{ steps.shasum.outputs.SHA_INTEL_MAC }}"
              end
            elsif OS.linux?
              if Hardware::CPU.arm?
                url "https://github.com/Bengerthelorf/bcmr/releases/download/${{ steps.release.outputs.VERSION }}/bcmr-aarch64-linux.tar.gz"
                sha256 "${{ steps.shasum.outputs.SHA_ARM_LINUX }}"
              else
                url "https://github.com/Bengerthelorf/bcmr/releases/download/${{ steps.release.outputs.VERSION }}/bcmr-x86_64-linux.tar.gz"
                sha256 "${{ steps.shasum.outputs.SHA_X86_LINUX }}"
              end
            end

            def install
              bin.install "bcmr"
            end

            test do
              system "#{bin}/bcmr", "--version"
            end
          end
          EOF

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add bcmr.rb
          git commit -m "Update bcmr to ${{ steps.release.outputs.VERSION }}" || echo "No changes to commit"
          git push origin main
