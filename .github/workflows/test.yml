name: Test

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check compilation
        run: cargo check --verbose

      - name: Run all unit tests
        run: cargo test --verbose --features test-support

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --features test-support -- -D warnings

      - name: Formatting check
        run: cargo fmt --check

      - name: Test shell init scripts
        shell: bash
        run: |
          cargo run -- init bash --cmd b > /dev/null
          cargo run -- init zsh --cmd b > /dev/null
          cargo run -- init fish --cmd b > /dev/null
          cargo run -- init bash --cmd '' > /dev/null
          cargo run -- init zsh --no-cmd --path /tmp > /dev/null
          cargo run -- init bash --cmd --prefix p --suffix + > /dev/null
          echo "All init scripts generated successfully"

      - name: Test shell completions (all shells)
        shell: bash
        run: |
          cargo run -- completions bash > /dev/null
          cargo run -- completions zsh > /dev/null
          cargo run -- completions fish > /dev/null
          cargo run -- completions powershell > /dev/null
          echo "All completion scripts generated successfully"

      - name: Test completions install / uninstall (POSIX shells)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # rustup reads $HOME for its toolchain config; build once with the
          # real HOME, then run the binary directly with a temp HOME.
          # Clear XDG_*_HOME for the HOME-fallback assertions — the runner
          # may export them, which would override our isolated $FAKE root.
          cargo build --quiet
          BCMR=./target/debug/bcmr
          FAKE=$(mktemp -d)
          run_isolated() { HOME=$FAKE XDG_DATA_HOME= XDG_CONFIG_HOME= "$@"; }

          path=$(run_isolated $BCMR completions zsh --install --print)
          test -z "$path" && { echo "FAIL: --print returned empty"; exit 1; }
          test ! -e "$path" || { echo "FAIL: --print should not write file"; exit 1; }

          for shell in bash zsh fish; do
            run_isolated $BCMR completions $shell --install
          done
          test -s "$FAKE/.local/share/zsh/site-functions/_bcmr" || { echo "FAIL: zsh path"; exit 1; }
          test -s "$FAKE/.local/share/bash-completion/completions/bcmr" || { echo "FAIL: bash path"; exit 1; }
          test -s "$FAKE/.config/fish/completions/bcmr.fish" || { echo "FAIL: fish path"; exit 1; }

          run_isolated $BCMR completions zsh --install --uninstall
          test ! -e "$FAKE/.local/share/zsh/site-functions/_bcmr"

          if run_isolated $BCMR completions powershell --install 2>/dev/null; then
            echo "FAIL: --install should reject powershell"
            exit 1
          fi

          if run_isolated $BCMR completions zsh --install --print --uninstall 2>/dev/null; then
            echo "FAIL: --print + --uninstall should be rejected"
            exit 1
          fi

          if run_isolated $BCMR completions --print 2>/dev/null; then
            echo "FAIL: --print without --install should be rejected"
            exit 1
          fi

          # XDG override: the install path must follow XDG_DATA_HOME, not just $HOME.
          XDG_DATA=$(mktemp -d)
          xdg_path=$(HOME=$FAKE XDG_DATA_HOME=$XDG_DATA $BCMR completions zsh --install --print)
          [ "$xdg_path" = "$XDG_DATA/zsh/site-functions/_bcmr" ] || {
            echo "FAIL: XDG_DATA_HOME not honored; got '$xdg_path'"; exit 1;
          }
          rm -rf "$XDG_DATA"

          rm -rf "$FAKE"
          echo "completions install tests passed"

      - name: Test PowerShell completions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = cargo run -- completions powershell 2>$null
          if (-not $output) { throw "Empty completion output" }

          $regCount = ($output | Select-String "Register-ArgumentCompleter").Count
          if ($regCount -ne 1) { throw "Expected 1 Register-ArgumentCompleter, got $regCount" }

          $remoteCount = ($output | Select-String "__complete-remote").Count
          if ($remoteCount -eq 0) { throw "Remote completion injection missing" }

          $output | Out-String | Invoke-Expression
          Write-Host "PowerShell completions loaded successfully"

      - name: Test __complete-remote (no crash on invalid input)
        shell: bash
        run: |
          cargo run -- __complete-remote "nonexistent-host:/path" 2>/dev/null || true
          cargo run -- __complete-remote "not-a-remote" 2>/dev/null || true
          echo "__complete-remote handled gracefully"

      - name: Test copy operations
        shell: bash
        run: |
          mkdir -p /tmp/bcmr-test-src /tmp/bcmr-test-dst
          echo "hello" > /tmp/bcmr-test-src/file1.txt
          echo "world" > /tmp/bcmr-test-src/file2.txt
          mkdir -p /tmp/bcmr-test-src/subdir
          echo "nested" > /tmp/bcmr-test-src/subdir/file3.txt

          # Single file copy
          cargo run -- copy /tmp/bcmr-test-src/file1.txt /tmp/bcmr-test-dst/
          test -f /tmp/bcmr-test-dst/file1.txt
          diff /tmp/bcmr-test-src/file1.txt /tmp/bcmr-test-dst/file1.txt

          # Multiple file copy
          mkdir -p /tmp/bcmr-test-multi
          cargo run -- copy /tmp/bcmr-test-src/file1.txt /tmp/bcmr-test-src/file2.txt /tmp/bcmr-test-multi/
          diff /tmp/bcmr-test-src/file1.txt /tmp/bcmr-test-multi/file1.txt
          diff /tmp/bcmr-test-src/file2.txt /tmp/bcmr-test-multi/file2.txt

          # Recursive directory copy (dst exists -> src dir nested inside)
          mkdir -p /tmp/bcmr-test-dst/recursive-test
          cargo run -- copy -r /tmp/bcmr-test-src/ /tmp/bcmr-test-dst/recursive-test/
          diff /tmp/bcmr-test-src/subdir/file3.txt /tmp/bcmr-test-dst/recursive-test/bcmr-test-src/subdir/file3.txt

          # Force overwrite
          echo "modified" > /tmp/bcmr-test-src/file1.txt
          cargo run -- copy -fy /tmp/bcmr-test-src/file1.txt /tmp/bcmr-test-dst/
          diff /tmp/bcmr-test-src/file1.txt /tmp/bcmr-test-dst/file1.txt

          echo "Copy tests passed"

      - name: Test copy with verify
        shell: bash
        run: |
          echo "verify-test-content" > /tmp/bcmr-test-src/verify.txt
          # The Done line should advertise the verify pass.
          out=$(cargo run --quiet -- copy --plain --verify /tmp/bcmr-test-src/verify.txt /tmp/bcmr-test-dst/ 2>&1)
          echo "$out"
          echo "$out" | grep -q "verified" || { echo "FAIL: expected 'verified' in Done line under -V"; exit 1; }
          diff /tmp/bcmr-test-src/verify.txt /tmp/bcmr-test-dst/verify.txt

          # And without -V, no 'verified' suffix.
          rm /tmp/bcmr-test-dst/verify.txt
          out2=$(cargo run --quiet -- copy --plain /tmp/bcmr-test-src/verify.txt /tmp/bcmr-test-dst/ 2>&1)
          if echo "$out2" | grep -q "verified"; then
            echo "FAIL: 'verified' should not appear without -V"
            exit 1
          fi
          echo "Copy with verify passed"

      - name: Test copy with preserve
        if: runner.os != 'Windows'
        shell: bash
        run: |
          touch -t 202001011200 /tmp/bcmr-test-src/file1.txt
          cargo run -- copy -p /tmp/bcmr-test-src/file1.txt /tmp/bcmr-test-dst/preserved.txt
          test -f /tmp/bcmr-test-dst/preserved.txt
          echo "Copy with preserve passed"

      - name: Test dry-run mode
        shell: bash
        run: |
          cargo run -- copy -r -n /tmp/bcmr-test-src/ /tmp/bcmr-test-dst/dryrun-target/
          # Directory should NOT exist after dry run
          test ! -d /tmp/bcmr-test-dst/dryrun-target/
          echo "Dry-run test passed"

      - name: Test path bookmarks (@alias resolution)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Build a config with a [paths] map pointing at a local dest dir,
          # then run a copy using the @alias and confirm the file lands at
          # the resolved path.
          tmp=$(mktemp -d)
          mkdir -p "$tmp/dst"
          cat > "$tmp/cfg.toml" <<EOF
          [paths]
          local = "$tmp/dst/"
          EOF
          echo "bookmark-test" > "$tmp/src.txt"

          # Bare alias resolves to the dest dir.
          cargo run --quiet -- --config "$tmp/cfg.toml" copy --plain "$tmp/src.txt" @local
          test -f "$tmp/dst/src.txt" || { echo "FAIL: @local should resolve to dst dir"; exit 1; }

          # Alias with a relative suffix.
          cargo run --quiet -- --config "$tmp/cfg.toml" copy --plain "$tmp/src.txt" @local/named.txt
          test -f "$tmp/dst/named.txt" || { echo "FAIL: @local/named.txt should resolve"; exit 1; }
          diff "$tmp/src.txt" "$tmp/dst/named.txt"

          # Unknown alias must error with a did-you-mean hint, not silently
          # try to copy a file literally named '@locl'. Levenshtein distance
          # between the typo and 'local' is 1, well within the suggestion
          # threshold.
          err=$(cargo run --quiet -- --config "$tmp/cfg.toml" copy --plain "$tmp/src.txt" @locl 2>&1 || true)
          echo "$err" | grep -q "unknown path alias '@locl'" || { echo "FAIL: missing unknown-alias error"; exit 1; }
          echo "$err" | grep -q "did you mean '@local'" || { echo "FAIL: missing did-you-mean"; exit 1; }

          # Invalid alias name errors with the regex hint.
          err2=$(cargo run --quiet -- --config "$tmp/cfg.toml" copy --plain "$tmp/src.txt" '@bad!' 2>&1 || true)
          echo "$err2" | grep -q "invalid alias name '@bad!'" || { echo "FAIL: missing invalid-name error"; exit 1; }

          rm -rf "$tmp"
          echo "Path bookmark tests passed"

      - name: Test exclude patterns
        shell: bash
        run: |
          mkdir -p /tmp/bcmr-exclude-src /tmp/bcmr-exclude-dst
          echo "keep" > /tmp/bcmr-exclude-src/keep.txt
          echo "skip" > /tmp/bcmr-exclude-src/skip.log
          echo "keep2" > /tmp/bcmr-exclude-src/keep2.md
          cargo run -- copy -r --exclude='\.log$' /tmp/bcmr-exclude-src/ /tmp/bcmr-exclude-dst/
          test -f /tmp/bcmr-exclude-dst/bcmr-exclude-src/keep.txt
          test ! -f /tmp/bcmr-exclude-dst/bcmr-exclude-src/skip.log
          echo "Exclude pattern test passed"

      - name: Test move operations
        shell: bash
        run: |
          mkdir -p /tmp/bcmr-move-dst
          echo "moveme" > /tmp/bcmr-move-src.txt
          cargo run -- move /tmp/bcmr-move-src.txt /tmp/bcmr-move-dst/
          test -f /tmp/bcmr-move-dst/bcmr-move-src.txt
          test ! -f /tmp/bcmr-move-src.txt
          echo "Move test passed"

      - name: Test remove operations
        shell: bash
        run: |
          mkdir -p /tmp/bcmr-rm-test
          echo "deleteme" > /tmp/bcmr-rm-test/file.txt
          cargo run -- remove -f /tmp/bcmr-rm-test/file.txt
          test ! -f /tmp/bcmr-rm-test/file.txt

          echo "a" > /tmp/bcmr-rm-test/a.txt
          echo "b" > /tmp/bcmr-rm-test/b.txt
          cargo run -- remove -rf /tmp/bcmr-rm-test/
          test ! -d /tmp/bcmr-rm-test/
          echo "Remove tests passed"

      - name: Test remove with symlinks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Regression test for: remove_path only handled is_file/is_dir and
          # silently skipped symlinks, which then made rmdir on the parent
          # fail with ENOTEMPTY. This covers both valid and dangling links
          # plus the top-level symlink case.
          set -eu
          root=/tmp/bcmr-symlink-test
          rm -rf "$root"
          mkdir -p "$root/dir"

          echo content > "$root/target.txt"
          ln -s "$root/target.txt" "$root/dir/valid_link"
          ln -s /nonexistent/path "$root/dir/dangling_link"
          echo real > "$root/dir/real_file"

          cargo run -- remove -rf "$root/dir"
          test ! -e "$root/dir" || { echo "FAIL: dir not removed"; exit 1; }
          test -f "$root/target.txt" || { echo "FAIL: symlink target was followed"; exit 1; }

          # Top-level dangling symlink
          ln -s /nonexistent "$root/top_dangling"
          cargo run -- remove -f "$root/top_dangling"
          test ! -e "$root/top_dangling" || { echo "FAIL: top-level symlink not removed"; exit 1; }

          echo "Symlink remove tests passed"

      - name: Test --json error event and status state machine
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Regression test for: errors after runner creation produced no
          # terminal event in the log, so bcmr status reported "done" for
          # jobs that had actually failed. Also covers the done/failed/
          # interrupted state machine.
          set -eu
          root=/tmp/bcmr-status-sm
          rm -rf "$root"
          mkdir -p "$root/sub"
          echo x > "$root/sub/a.txt"

          # --- happy path: status should be "done" ---
          rm -rf "$root/ok"
          mkdir -p "$root/ok"
          echo ok > "$root/ok/f.txt"
          desc=$(cargo run --quiet -- remove -rfy --json "$root/ok")
          jid=$(echo "$desc" | python3 -c 'import json,sys;print(json.loads(sys.stdin.read())["job_id"])')
          log=$(echo "$desc" | python3 -c 'import json,sys;print(json.loads(sys.stdin.read())["log"])')
          for _ in $(seq 1 60); do
            if grep -q '"type":"result"' "$log" 2>/dev/null; then break; fi
            sleep 0.5
          done
          cargo run --quiet -- status "$jid" --json | grep -q '"state":"done"' \
            || { echo "FAIL: happy path not done"; cat "$log"; exit 1; }

          # --- error path: non-recursive remove of a non-empty dir ---
          # Must terminate the log with a status:"error" result and
          # status must report "failed".
          desc=$(cargo run --quiet -- remove --json "$root/sub" 2>&1 | head -1)
          jid=$(echo "$desc" | python3 -c 'import json,sys;print(json.loads(sys.stdin.read())["job_id"])')
          log=$(echo "$desc" | python3 -c 'import json,sys;print(json.loads(sys.stdin.read())["log"])')
          for _ in $(seq 1 60); do
            if grep -q '"type":"result"' "$log" 2>/dev/null; then break; fi
            sleep 0.5
          done
          cat "$log"
          grep -q '"status":"error"' "$log" \
            || { echo "FAIL: error path did not write error result"; exit 1; }
          cargo run --quiet -- status "$jid" --json | grep -q '"state":"failed"' \
            || { echo "FAIL: status did not report failed"; exit 1; }

          echo "Error event + state machine tests passed"

      - name: Test --json background mode (remove)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Regression test for: --json bg mode writing nothing to the log
          # when check_removes took a long time. The child must emit a
          # scanning heartbeat before the scan completes, and the log must
          # contain a terminal "result" line after the job finishes.
          set -eu

          root=/tmp/bcmr-json-bg
          rm -rf "$root"
          mkdir -p "$root"
          # ~5k files across many dirs so scanning is non-trivial.
          for i in $(seq 1 100); do
            mkdir -p "$root/dir$i"
            for j in $(seq 1 50); do
              echo "x$j" > "$root/dir$i/f$j.txt"
            done
          done

          # Build targets list (26 paths to mirror the reported bug).
          targets=""
          for i in $(seq 1 26); do targets="$targets $root/dir$i"; done

          desc=$(cargo run --quiet -- remove -rfy --json $targets)
          echo "descriptor: $desc"

          job_id=$(echo "$desc" | python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["job_id"])')
          log=$(echo "$desc" | python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["log"])')
          echo "job_id=$job_id log=$log"

          # Wait up to 30s for the result line to appear.
          for _ in $(seq 1 60); do
            if grep -q '"type":"result"' "$log" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          echo "--- log contents ---"
          cat "$log"
          echo "--- end log ---"

          # The log must contain at least one progress line AND a terminal
          # result line. A regression of the scan-blocks-writer bug would
          # leave the log with only the descriptor.
          grep -q '"type":"progress"' "$log" || { echo "FAIL: no progress line"; exit 1; }
          grep -q '"type":"result"' "$log" || { echo "FAIL: no result line"; exit 1; }
          grep -q '"status":"success"' "$log" || { echo "FAIL: job did not succeed"; exit 1; }

          # All 26 target dirs should be gone.
          for i in $(seq 1 26); do
            if [ -e "$root/dir$i" ]; then
              echo "FAIL: $root/dir$i still exists"
              exit 1
            fi
          done

          # bcmr status should find the job and report complete.
          status=$(cargo run --quiet -- status "$job_id" --json)
          echo "status: $status"
          echo "$status" | grep -q '"type":"result"' || { echo "FAIL: status did not return result"; exit 1; }

          # bcmr status <id> --watch should replay the existing log and exit
          # at the result event. The log is already terminal here, so --watch
          # returns immediately.
          watch_pretty=$(cargo run --quiet -- status "$job_id" --watch)
          echo "$watch_pretty"
          echo "$watch_pretty" | grep -q "Done:" || { echo "FAIL: --watch missing terminal Done line"; exit 1; }
          watch_json=$(cargo run --quiet -- --json status "$job_id" --watch)
          echo "$watch_json" | grep -q '"type":"result"' || { echo "FAIL: --watch --json missing result event"; exit 1; }

          # Conflict: --watch needs a job_id, can't pair with --rm/--gc.
          if cargo run --quiet -- status --watch 2>/dev/null; then
            echo "FAIL: --watch without job_id should be rejected"; exit 1;
          fi
          if cargo run --quiet -- status "$job_id" --watch --rm 2>/dev/null; then
            echo "FAIL: --watch + --rm should be rejected"; exit 1;
          fi

          # Stale-job lifecycle: a header pointing at a dead pid + no result event
          # must error within STARTUP_GRACE rather than poll forever.
          jobs_dir="${XDG_DATA_HOME:-$HOME/.local/share}/bcmr/jobs"
          mkdir -p "$jobs_dir"
          stale_id="stale-$$"
          dead_pid=$(bash -c 'sleep 0.05 & echo $!; wait')
          printf '{"job_id":"%s","pid":%s,"log":"%s/%s.jsonl"}\n' \
            "$stale_id" "$dead_pid" "$jobs_dir" "$stale_id" \
            > "$jobs_dir/$stale_id.jsonl"
          start=$(date +%s)
          if timeout 5 cargo run --quiet -- status "$stale_id" --watch 2>&1; then
            echo "FAIL: --watch should exit non-zero on stale (writer-dead) job"; exit 1;
          fi
          end=$(date +%s)
          if [ $((end - start)) -gt 4 ]; then
            echo "FAIL: stale job detection took $((end - start))s (expected <2s)"; exit 1;
          fi
          rm -f "$jobs_dir/$stale_id.jsonl"

          # Spawn-then-watch race: kicking off --watch before the writer has flushed
          # its header must wait through STARTUP_GRACE rather than error 'not found'.
          race_id="race-$$"
          live_pid=$$
          (
            sleep 0.4
            printf '{"job_id":"%s","pid":%s,"log":"x"}\n{"type":"result","status":"success","duration_secs":0.1,"bytes_total":0}\n' \
              "$race_id" "$live_pid" > "$jobs_dir/$race_id.jsonl"
          ) &
          out=$(timeout 5 cargo run --quiet -- status "$race_id" --watch 2>&1) || true
          wait
          echo "$out" | grep -qE 'Done:|"type":"result"' || {
            echo "FAIL: race --watch missed result; got: $out"; exit 1;
          }
          rm -f "$jobs_dir/$race_id.jsonl"

          # bcmr status --rm <id> should drop just that job's log.
          rm_out=$(cargo run --quiet -- --json status "$job_id" --rm)
          echo "rm: $rm_out"
          echo "$rm_out" | grep -q '"removed":true' || { echo "FAIL: --rm did not report removed:true"; exit 1; }
          [ -e "$log" ] && { echo "FAIL: log file still exists after --rm"; exit 1; }

          # bcmr status --gc returns a count (no surviving jobs to GC here).
          gc_out=$(cargo run --quiet -- --json status --gc)
          echo "gc: $gc_out"
          echo "$gc_out" | grep -q '"action":"gc"' || { echo "FAIL: --gc did not report action"; exit 1; }

          # Conflict: --rm + --gc should be rejected by clap.
          if cargo run --quiet -- status --rm --gc 2>/dev/null; then
            echo "FAIL: clap should reject --rm + --gc"
            exit 1
          fi

          # Conflict: positional id + --all should be rejected by clap.
          if cargo run --quiet -- status someid --rm --all 2>/dev/null; then
            echo "FAIL: clap should reject positional id + --all"
            exit 1
          fi

          echo "--json background mode remove test passed"

      - name: Test version and help
        shell: bash
        run: |
          cargo run -- --version
          cargo run -- --help
          cargo run -- copy --help
          cargo run -- move --help
          cargo run -- remove --help
          cargo run -- init --help
          cargo run -- update --help
          cargo run -- completions --help
          cargo run -- doctor --help
          echo "Help/version tests passed"

      - name: Test no-args common-usage hint
        shell: bash
        run: |
          # Bare 'bcmr' should exit 0 and print the common-usage block.
          out=$(cargo run --quiet)
          echo "$out"
          echo "$out" | grep -q "Common usage:" || { echo "FAIL: missing 'Common usage:' header"; exit 1; }
          echo "$out" | grep -q "bcmr copy -r src/ host:dst/" || { echo "FAIL: missing example"; exit 1; }
          echo "$out" | grep -q "bcmr help" || { echo "FAIL: missing help pointer"; exit 1; }

          # Subcommand typo should suggest the closest match (clap default).
          err=$(cargo run --quiet -- cp 2>&1 || true)
          echo "$err" | grep -q "copy" || { echo "FAIL: did-you-mean did not suggest 'copy' for 'cp'"; exit 1; }
          echo "no-args + did-you-mean tests passed"

      - name: Test bcmr doctor (local + JSON shape)
        shell: bash
        run: |
          # Plain run with no host args should exit 0 on a healthy CI runner.
          out=$(cargo run --quiet -- doctor)
          echo "$out"
          echo "$out" | grep -q "Local:" || { echo "FAIL: missing 'Local:' header"; exit 1; }
          echo "$out" | grep -q "config file" || { echo "FAIL: missing config file check"; exit 1; }
          echo "$out" | grep -q "jobs dir" || { echo "FAIL: missing jobs dir check"; exit 1; }
          echo "$out" | grep -q "Pass host arguments" || { echo "FAIL: missing host hint"; exit 1; }

          # JSON shape: single object with the four documented top-level keys.
          js=$(cargo run --quiet -- --json doctor)
          echo "$js"
          echo "$js" | grep -q '"bcmr_version"' || { echo "FAIL: missing bcmr_version"; exit 1; }
          echo "$js" | grep -q '"local"' || { echo "FAIL: missing local array"; exit 1; }
          echo "$js" | grep -q '"hosts"' || { echo "FAIL: missing hosts array"; exit 1; }
          echo "$js" | grep -q '"ok":true' || { echo "FAIL: missing ok=true on healthy local"; exit 1; }

          # Unreachable host should make the run exit non-zero.
          if cargo run --quiet -- doctor this-host-does-not-resolve.invalid 2>/dev/null; then
            echo "FAIL: doctor against unreachable host should exit non-zero"
            exit 1
          fi

          # --config <PATH> should be honored — point at a file with valid TOML
          # and confirm doctor names it back in the report. We assert the
          # basename only because mktemp on Windows Git Bash returns a Unix-
          # style path while Rust prints the canonical Windows path.
          tmp=$(mktemp)
          echo '[progress]' > "$tmp"
          echo 'style = "plain"' >> "$tmp"
          out2=$(cargo run --quiet -- --config "$tmp" doctor)
          echo "$out2"
          base=$(basename "$tmp")
          echo "$out2" | grep -q "$base" || { echo "FAIL: --config basename '$base' not surfaced"; exit 1; }
          rm -f "$tmp"

          echo "doctor smoke tests passed"
